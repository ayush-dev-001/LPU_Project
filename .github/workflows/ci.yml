name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      # Build-time placeholders only; nothing connects to them during the build.
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/ci
      SESSION_SECRET: ci-only-secret-that-is-at-least-32-characters-long
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma validate
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
